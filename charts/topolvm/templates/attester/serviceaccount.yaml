{{- if .Values.attester.enabled }}
# The ServiceAccount names are fixed by values, not derived from the release name:
# the aiDAPTIV middleware (MW) hardcodes the attester's username,
# system:serviceaccount:<namespace>:<attester.serviceAccountName>.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.attester.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: attester
    {{- include "topolvm.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.attester.agent.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: attester-agent
    {{- include "topolvm.labels" . | nindent 4 }}
{{- end }}
