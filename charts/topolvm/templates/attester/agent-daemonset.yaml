{{- if .Values.attester.enabled }}
# topolvm-attester-agent runs Sails against the NVMe disks of the node's volume group.
# It is privileged and shares the host PID namespace: Sails issues vendor-unique
# commands to the devices and pvs runs through nsenter on the host, as lvmd does.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ template "topolvm.fullname" . }}-attester-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: attester-agent
    {{- include "topolvm.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: attester-agent
      {{- include "topolvm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: attester-agent
        {{- include "topolvm.selectorLabels" . | nindent 8 }}
        {{- with .Values.attester.agent.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.attester.agent.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.attester.agent.serviceAccountName }}
      hostPID: true
      {{- with .Values.attester.agent.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # The Sails image only carries the binary and its libraries; they are copied
        # into the shared volume, as in the lvmd values.
        - name: sails-provider
          image: "{{ .Values.attester.agent.sails.image }}"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: sails
              mountPath: /shared
      containers:
        - name: topolvm-attester-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.reference }}"
          {{- with .Values.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          command:
            - /topolvm-attester-agent
            - --listen-address=:{{ .Values.attester.agent.port }}
            - --sails=/shared/Sails
            - --volume-group={{ .Values.attester.volumeGroup }}
            - --attester-service-account={{ .Values.attester.serviceAccountName }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            # Sails is dynamically linked against the libraries shipped next to it.
            - name: LD_LIBRARY_PATH
              value: /shared/lib
          ports:
            - name: http
              containerPort: {{ .Values.attester.agent.port }}
              protocol: TCP
          securityContext:
            privileged: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          {{- with .Values.attester.agent.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: sails
              mountPath: /shared
            - name: dev
              mountPath: /dev
      volumes:
        - name: sails
          emptyDir: {}
        - name: dev
          hostPath:
            path: /dev
            type: Directory
      {{- with .Values.attester.agent.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.attester.agent.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.attester.agent.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
