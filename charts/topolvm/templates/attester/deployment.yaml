{{- if .Values.attester.enabled }}
# topolvm-attester: the API MW calls. It runs no controller, so every replica serves
# and leader election stays off.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "topolvm.fullname" . }}-attester
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: attester
    {{- include "topolvm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.attester.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: attester
      {{- include "topolvm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: attester
        {{- include "topolvm.selectorLabels" . | nindent 8 }}
        {{- with .Values.attester.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.attester.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        {{- toYaml .Values.securityContext | nindent 8 }}
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.attester.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.attester.serviceAccountName }}
      containers:
        - name: topolvm-attester
          image: "{{ .Values.image.repository }}:{{ .Values.image.reference }}"
          {{- with .Values.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          command:
            - /topolvm-attester
            - --health-probe-bind-address=:8081
            - --webhook-cert-path=/certs
            - --storage-class={{ .Values.attester.storageClass }}
            - --volume-group={{ .Values.attester.volumeGroup }}
            - --agent-port={{ .Values.attester.agent.port }}
            - --agent-service-account={{ .Values.attester.agent.serviceAccountName }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Attestations are tokens of this ServiceAccount bound to this Pod.
            - name: POD_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - name: https
              containerPort: 9443
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.attester.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            {{- if .Values.attester.certManager }}
            secretName: {{ template "topolvm.fullname" . }}-attester-tls
            {{- else }}
            secretName: {{ required "attester.tlsSecretName is required when attester.certManager is false" .Values.attester.tlsSecretName }}
            {{- end }}
      {{- with .Values.attester.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.attester.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.attester.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
